
<h2 class="sr-only">自营车辆运营分析看板：含成本对比、单位成本对比、运行时效对比三个交互图表</h2>
<style>
.tb{padding:10px 22px;background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;font-size:14px;color:var(--color-text-secondary);font-weight:400}
.tb.on{border-bottom-color:#378ADD;color:var(--color-text-primary);font-weight:500}
.pnl{padding-top:18px}
.fr{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:3px}
.fl{font-size:11px;color:var(--color-text-secondary)}
.mc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}
.ml{font-size:11px;color:var(--color-text-secondary);margin:0 0 3px}
.mv{font-size:18px;font-weight:500;margin:0;color:var(--color-text-primary)}
.mv.up{color:#E24B4A}.mv.dn{color:#1D9E75}
.lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12px;color:var(--color-text-secondary)}
.ld{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.nodata{display:flex;align-items:center;justify-content:center;height:100%;color:var(--color-text-secondary);font-size:13px}
</style>

<div style="display:flex;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:0">
  <button class="tb" id="tb0" onclick="sw(0)">成本对比</button>
  <button class="tb" id="tb1" onclick="sw(1)">单位成本对比</button>
  <button class="tb" id="tb2" onclick="sw(2)">运行时效对比</button>
</div>

<div id="p0" class="pnl">
  <div class="fr">
    <div class="fg"><span class="fl">线路</span><select id="r0" onchange="uc1()"></select></div>
    <div class="fg"><span class="fl">期数1</span><select id="a0" onchange="uc1()"></select></div>
    <div class="fg"><span class="fl">期数2</span><select id="b0" onchange="uc1()"></select></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
    <div class="mc"><p class="ml">期数1 平均单程成本</p><p class="mv" id="m01">--</p></div>
    <div class="mc"><p class="ml">期数2 平均单程成本</p><p class="mv" id="m02">--</p></div>
    <div class="mc"><p class="ml">成本变化</p><p class="mv" id="m03">--</p></div>
  </div>
  <div style="position:relative;height:300px" id="w0"><canvas id="ch0" role="img" aria-label="两个统计期成本构成堆叠柱状图对比">比较两个统计期的各项成本构成</canvas></div>
  <div class="lg" id="lg0"></div>
</div>

<div id="p1" class="pnl" style="display:none">
  <div class="fr">
    <div class="fg"><span class="fl">线路1</span><select id="r1a" onchange="uc2()"></select></div>
    <div class="fg"><span class="fl">线路2</span><select id="r1b" onchange="uc2()"></select></div>
    <div class="fg"><span class="fl">期数</span><select id="pd1" onchange="uc2()"></select></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
    <div class="mc"><p class="ml">线路1 单位成本 ($/mile)</p><p class="mv" id="m11">--</p></div>
    <div class="mc"><p class="ml">线路2 单位成本 ($/mile)</p><p class="mv" id="m12">--</p></div>
    <div class="mc"><p class="ml">差值</p><p class="mv" id="m13">--</p></div>
  </div>
  <div style="position:relative;height:300px" id="w1"><canvas id="ch1" role="img" aria-label="两条线路各成本分项单位成本对比图">比较两条线路的每英里单位成本构成</canvas></div>
  <div class="lg" id="lg1"></div>
</div>

<div id="p2" class="pnl" style="display:none">
  <div class="fr">
    <div class="fg"><span class="fl">线路</span><select id="r2" onchange="uc3()"></select></div>
    <div class="fg"><span class="fl">期数1</span><select id="a2" onchange="uc3()"></select></div>
    <div class="fg"><span class="fl">期数2</span><select id="b2" onchange="uc3()"></select></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px">
    <div class="mc"><p class="ml">期数1 行程数</p><p class="mv" id="m21">--</p></div>
    <div class="mc"><p class="ml">期数1 平均时长</p><p class="mv" id="m22">--</p></div>
    <div class="mc"><p class="ml">期数2 行程数</p><p class="mv" id="m23">--</p></div>
    <div class="mc"><p class="ml">期数2 平均时长</p><p class="mv" id="m24">--</p></div>
  </div>
  <div style="position:relative;height:300px" id="w2"><canvas id="ch2" role="img" aria-label="两个统计期单程运行时长对比柱状图">比较两个统计期各行程的单程运行时长</canvas></div>
  <div class="lg" id="lg2"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA=[
  {period:1,route:"ATL-MCO-ATL",duration:7,miles:876,driver:744.6,loading:0,fuel:525.6,lease:392.21,personnel:100,other:0},
  {period:1,route:"ATL-BHM-ATL",duration:7,miles:326,driver:277.1,loading:0,fuel:220,lease:196.11,personnel:100,other:0},
  {period:1,route:"ATL-BHM-ATL",duration:8,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:10.12},
  {period:1,route:"ATL-MCO-ATL",duration:6,miles:876,driver:744.6,loading:0,fuel:525.6,lease:392.21,personnel:100,other:0},
  {period:1,route:"ATL-BHM-ATL",duration:7,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:1,route:"ATL-BHM-ATL",duration:6,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:1,route:"ATL-MCO-ATL",duration:8,miles:876,driver:744.6,loading:0,fuel:525.6,lease:392.21,personnel:100,other:0},
  {period:1,route:"ATL-MCO-ATL",duration:5,miles:876,driver:744.6,loading:0,fuel:525.6,lease:392.21,personnel:100,other:0},
  {period:1,route:"ATL-BHM-ATL",duration:5,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:7,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:6,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:6,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:6,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:5,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:2,route:"ATL-BHM-ATL",duration:5,miles:326,driver:277.1,loading:100,fuel:220,lease:196.11,personnel:100,other:0},
  {period:3,route:"ATL-MCO-OCF-ATL",duration:null,miles:876,driver:744.6,loading:0,fuel:0,lease:392.21,personnel:100,other:50,savings:-400},
  {period:3,route:"ATL-MCO-ATL",duration:8,miles:876,driver:744.6,loading:0,fuel:0,lease:392.21,personnel:100,other:0},
  {period:3,route:"ATL-MCO-ATL",duration:6,miles:876,driver:744.6,loading:0,fuel:0,lease:392.21,personnel:100,other:0},
  {period:3,route:"ATL-MCO-OCF-ATL",duration:null,miles:876,driver:744.6,loading:0,fuel:0,lease:392.21,personnel:100,other:50,savings:-400},
  {period:4,route:"ATL-MCO-OCF-ATL",duration:6,miles:881,driver:748.85,loading:0,fuel:0,lease:392.21,personnel:100,other:50,savings:-400},
  {period:4,route:"ATL-MCO-ATL",duration:6,miles:875,driver:743.75,loading:0,fuel:0,lease:392.21,personnel:100,other:0},
  {period:4,route:"ATL-MCO-ATL",duration:6,miles:874,driver:742.9,loading:0,fuel:0,lease:392.21,personnel:100,other:0},
  {period:4,route:"CNO-DFW-LAX-CNO",duration:49,miles:2881,driver:2448.85,loading:0,fuel:0,lease:588.32,personnel:100,other:0},
  {period:5,route:"CNO-IAH-LAX-CNO",duration:null,miles:null,driver:0,loading:0,fuel:0,lease:588.32,personnel:100,other:0},
  {period:5,route:"CNO-DFW-LAX-CNO",duration:null,miles:null,driver:0,loading:0,fuel:0,lease:588.32,personnel:100,other:0}
];

DATA.forEach(d=>{
  d.savings=d.savings||0;
  d.total=d.driver+d.loading+d.fuel+d.lease+d.personnel+d.savings+d.other;
});

const ROUTES=[...new Set(DATA.map(d=>d.route))];
const PERIODS=[1,2,3,4,5];
const COMPS=['driver','loading','fuel','lease','personnel','other'];
const CLBLS=['司机工资','装卸费','油费','车辆租赁','人员成本','其他'];
const CCOLS=['#378ADD','#E24B4A','#EF9F27','#1D9E75','#7F77DD','#888780'];
const P2COLS=['#185FA5','#A32D2D','#BA7517','#0F6E56','#534AB7','#5F5E5A'];
let charts=[null,null,null];
let curTab=0;

function pop(id,items,fmt){
  const el=document.getElementById(id);
  el.innerHTML='';
  items.forEach(v=>{
    const o=document.createElement('option');
    o.value=v;o.text=fmt?fmt(v):v;
    el.appendChild(o);
  });
}

function fd(route,period){return DATA.filter(d=>d.route===route&&d.period===period);}

function avgObj(trips){
  if(!trips.length)return null;
  const n=trips.length,r={};
  COMPS.forEach(k=>r[k]=trips.reduce((a,t)=>a+(t[k]||0),0)/n);
  r.total=COMPS.reduce((a,k)=>a+r[k],0);
  r.miles=trips.reduce((a,t)=>a+(t.miles||0),0)/n;
  return r;
}

function fmt$(v){return v==null?'N/A':'$'+Math.round(v).toLocaleString();}
function fmtU(v){return v==null?'N/A':'$'+v.toFixed(3)+'/mi';}
function fmtH(v){return v==null?'N/A':v.toFixed(1)+'h';}

function mkLegend(id,labels,colors){
  const el=document.getElementById(id);
  el.innerHTML=labels.map((l,i)=>`<span><span class="ld" style="background:${colors[i]}"></span>${l}</span>`).join('');
}

function sw(i){
  curTab=i;
  ['tb0','tb1','tb2'].forEach((id,j)=>document.getElementById(id).classList.toggle('on',j===i));
  ['p0','p1','p2'].forEach((id,j)=>document.getElementById(id).style.display=j===i?'block':'none');
  if(i===0)uc1();
  if(i===1)uc2();
  if(i===2)uc3();
}

function uc1(){
  const route=document.getElementById('r0').value;
  const p1=+document.getElementById('a0').value;
  const p2=+document.getElementById('b0').value;
  const t1=fd(route,p1),t2=fd(route,p2);
  const a1=avgObj(t1),a2=avgObj(t2);
  document.getElementById('m01').textContent=a1?fmt$(a1.total):'无数据';
  document.getElementById('m02').textContent=a2?fmt$(a2.total):'无数据';
  if(a1&&a2){
    const diff=a2.total-a1.total;
    const el=document.getElementById('m03');
    el.textContent=(diff>=0?'+':'')+fmt$(diff);
    el.className='mv '+(diff>0?'up':'dn');
  } else {document.getElementById('m03').textContent='N/A';}
  const canvas=document.getElementById('ch0');
  if(charts[0]){charts[0].destroy();charts[0]=null;}
  if(!a1&&!a2){document.getElementById('w0').innerHTML='<div class="nodata">所选期数暂无该线路数据</div>';return;}
  if(!document.getElementById('ch0')){
    const c=document.createElement('canvas');c.id='ch0';c.role='img';c.setAttribute('aria-label','成本对比堆叠柱状图');
    document.getElementById('w0').innerHTML='';document.getElementById('w0').appendChild(c);
  }
  const datasets=COMPS.map((k,i)=>({
    label:CLBLS[i],
    data:[a1?+a1[k].toFixed(2):0,a2?+a2[k].toFixed(2):0],
    backgroundColor:CCOLS[i],
    borderRadius:3,stack:'s'
  }));
  charts[0]=new Chart(document.getElementById('ch0'),{
    type:'bar',
    data:{labels:[`第${p1}期`,`第${p2}期`],datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: $${Math.round(ctx.raw).toLocaleString()}`}}},
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{color:'#888'}},
        y:{stacked:true,beginAtZero:true,ticks:{callback:v=>'$'+v.toLocaleString(),color:'#888'},grid:{color:'rgba(128,128,128,0.15)'}}
      }
    }
  });
  mkLegend('lg0',CLBLS,CCOLS);
}

function uc2(){
  const r1=document.getElementById('r1a').value;
  const r2=document.getElementById('r1b').value;
  const pd=+document.getElementById('pd1').value;
  const t1=fd(r1,pd),t2=fd(r2,pd);
  const a1=avgObj(t1),a2=avgObj(t2);
  const u1=a1&&a1.miles>0?a1.total/a1.miles:null;
  const u2=a2&&a2.miles>0?a2.total/a2.miles:null;
  document.getElementById('m11').textContent=fmtU(u1);
  document.getElementById('m12').textContent=fmtU(u2);
  if(u1!=null&&u2!=null){
    const diff=u2-u1;
    const el=document.getElementById('m13');
    el.textContent=(diff>=0?'+':'')+'$'+Math.abs(diff).toFixed(3)+'/mi';
    el.className='mv '+(diff>0?'up':'dn');
  } else {document.getElementById('m13').textContent='N/A';}
  if(charts[1]){charts[1].destroy();charts[1]=null;}
  const w=document.getElementById('w1');
  if(!a1&&!a2){w.innerHTML='<div class="nodata">所选期数暂无数据</div>';return;}
  if(!document.getElementById('ch1')){
    const c=document.createElement('canvas');c.id='ch1';c.role='img';c.setAttribute('aria-label','单位成本对比图');
    w.innerHTML='';w.appendChild(c);
  }
  const uc1d=COMPS.map(k=>a1&&a1.miles>0?+(a1[k]/a1.miles).toFixed(4):0);
  const uc2d=COMPS.map(k=>a2&&a2.miles>0?+(a2[k]/a2.miles).toFixed(4):0);
  charts[1]=new Chart(document.getElementById('ch1'),{
    type:'bar',
    data:{
      labels:CLBLS,
      datasets:[
        {label:r1,data:uc1d,backgroundColor:'#378ADD',borderRadius:3},
        {label:r2,data:uc2d,backgroundColor:'#1D9E75',borderRadius:3}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: $${ctx.raw.toFixed(3)}/mi`}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#888'}},
        y:{beginAtZero:true,ticks:{callback:v=>'$'+v.toFixed(2),color:'#888'},grid:{color:'rgba(128,128,128,0.15)'}}
      }
    }
  });
  mkLegend('lg1',[r1,r2],['#378ADD','#1D9E75']);
}

function uc3(){
  const route=document.getElementById('r2').value;
  const p1=+document.getElementById('a2').value;
  const p2=+document.getElementById('b2').value;
  const t1=fd(route,p1).filter(d=>d.duration!=null);
  const t2=fd(route,p2).filter(d=>d.duration!=null);
  const avg1=t1.length?t1.reduce((a,t)=>a+t.duration,0)/t1.length:null;
  const avg2=t2.length?t2.reduce((a,t)=>a+t.duration,0)/t2.length:null;
  document.getElementById('m21').textContent=t1.length||'0';
  document.getElementById('m22').textContent=fmtH(avg1);
  document.getElementById('m23').textContent=t2.length||'0';
  document.getElementById('m24').textContent=fmtH(avg2);
  if(charts[2]){charts[2].destroy();charts[2]=null;}
  const w=document.getElementById('w2');
  if(!t1.length&&!t2.length){w.innerHTML='<div class="nodata">所选期数暂无该线路时长数据</div>';return;}
  if(!document.getElementById('ch2')){
    const c=document.createElement('canvas');c.id='ch2';c.role='img';c.setAttribute('aria-label','运行时效对比图');
    w.innerHTML='';w.appendChild(c);
  }
  const maxLen=Math.max(t1.length,t2.length);
  const labels=Array.from({length:maxLen},(_,i)=>`行程${i+1}`);
  const d1=labels.map((_,i)=>t1[i]?.duration??null);
  const d2=labels.map((_,i)=>t2[i]?.duration??null);
  const ln1=labels.map(()=>avg1);
  const ln2=labels.map(()=>avg2);
  charts[2]=new Chart(document.getElementById('ch2'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        {type:'bar',label:`第${p1}期`,data:d1,backgroundColor:'rgba(55,138,221,0.75)',borderRadius:3,order:2},
        {type:'bar',label:`第${p2}期`,data:d2,backgroundColor:'rgba(29,158,117,0.75)',borderRadius:3,order:2},
        {type:'line',label:`第${p1}期均值`,data:ln1,borderColor:'#185FA5',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,tension:0,order:1},
        {type:'line',label:`第${p2}期均值`,data:ln2,borderColor:'#0F6E56',borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,tension:0,order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw!=null?`${ctx.dataset.label}: ${ctx.raw.toFixed(1)}h`:''}}},
      scales:{
        x:{grid:{display:false},ticks:{color:'#888'}},
        y:{beginAtZero:false,ticks:{callback:v=>v+'h',color:'#888'},grid:{color:'rgba(128,128,128,0.15)'}}
      }
    }
  });
  mkLegend('lg2',
    [`第${p1}期`,`第${p2}期`,`第${p1}期均值`,`第${p2}期均值`],
    ['rgba(55,138,221,0.75)','rgba(29,158,117,0.75)','#185FA5','#0F6E56']
  );
}

pop('r0',ROUTES,v=>v);
pop('a0',PERIODS,v=>`第${v}期`);pop('b0',PERIODS,v=>`第${v}期`);
document.getElementById('b0').value=2;
pop('r1a',ROUTES,v=>v);pop('r1b',ROUTES,v=>v);
document.getElementById('r1b').value='ATL-BHM-ATL';
pop('pd1',PERIODS,v=>`第${v}期`);
pop('r2',ROUTES,v=>v);
pop('a2',PERIODS,v=>`第${v}期`);pop('b2',PERIODS,v=>`第${v}期`);
document.getElementById('b2').value=2;

sw(0);
</script>
